[versions]
agp = "8.13.0"
kotlin = "2.2.20"
kotlinx-serialization = "1.9.0"
binary-compatibility-validator = "0.18.1"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
junit = "4.13.2"
okhttp = "4.12.0"
kotlinx-coroutines = "1.10.2"
openai-java = "4.109.0"

[libraries]
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Substituted by the included EHBP build; see settings.gradle.kts.
ehbp = { module = "sh.tinfoil:ehbp" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
# Only the core of the OpenAI SDK: its own HTTP client is left out, so that
# this SDK's attested clients are the only way that it reaches the network.
openai-java-core = { module = "com.openai:openai-java-core", version.ref = "openai-java" }
# The OpenAI SDK and Jackson's Kotlin module ask for an older kotlin-reflect;
# it has to match the Kotlin standard library.
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
