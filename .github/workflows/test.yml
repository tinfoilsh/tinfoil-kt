name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TINFOIL_GO_AAR: ${{ github.workspace }}/build/tinfoil-go/TinfoilGo.aar
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Find the pinned tinfoil-go commit
        id: pinned
        run: |
          commit="$(sed -n 's/^commit=\([0-9a-f]\{40\}\)$/\1/p' tinfoil-go.properties)"
          if [[ -z "$commit" ]]; then
            echo "::error::tinfoil-go.properties names no full commit"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The verifier library is built from source at the pinned commit, and
      # kept between runs under that commit.
      - name: Restore the verifier library
        id: verifier
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tinfoil-go/TinfoilGo.aar
          key: tinfoil-go-aar-${{ steps.pinned.outputs.commit }}

      - name: Check out tinfoil-go
        if: steps.verifier.outputs.cache-hit != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: tinfoilsh/tinfoil-go
          ref: ${{ steps.pinned.outputs.commit }}
          path: build/tinfoil-go/source
          persist-credentials: false

      - name: Set up Go
        if: steps.verifier.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: build/tinfoil-go/source/go.mod
          cache: false

      - name: Build the verifier library
        if: steps.verifier.outputs.cache-hit != 'true'
        working-directory: build/tinfoil-go/source
        run: |
          version="$(tr -d '[:space:]' < scripts/android-ndk-version.txt)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$version"
          bash scripts/setup-mobile.sh
          bash scripts/build-mobile-android.sh "$TINFOIL_GO_AAR"

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Pull requests read the cache and never write it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, lint and run the unit tests
        run: ./gradlew --console=plain :tinfoil:assembleRelease :tinfoil:lintRelease :tinfoil:testDebugUnitTest

      # The verifier library is native code for Android, so the tests that
      # reach it run on an emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator's data partition does not fit beside the SDKs that the
      # runner image ships, so the ones this build never uses are removed.
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /

      - name: Run the instrumented tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew --console=plain :tinfoil:connectedDebugAndroidTest
